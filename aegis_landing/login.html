<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #111827;
            --text-sub: #6b7280;
            --error: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .toggle-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .toggle-mode a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }

        .toggle-mode a:hover {
            text-decoration: underline;
        }

        #errorMessage {
            color: var(--error);
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <h1 id="formTitle">Sign In</h1>
            <p id="formSubtitle">Enter your credentials to access AEGIS.</p>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
            <div id="errorMessage"></div>
        </form>

        <div class="toggle-mode">
            <span id="toggleText">Don't have an account?</span> 
            <a onclick="toggleMode()">Register</a>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').textContent = isLoginMode ? 'Sign In' : 'Create Account';
            document.getElementById('formSubtitle').textContent = isLoginMode ? 'Enter your credentials to access AEGIS.' : 'Register a new account.';
            document.getElementById('submitBtn').textContent = isLoginMode ? 'Sign In' : 'Register';
            document.getElementById('toggleText').textContent = isLoginMode ? "Don't have an account?" : "Already have an account?";
            document.querySelector('.toggle-mode a').textContent = isLoginMode ? 'Register' : 'Sign In';
            document.getElementById('errorMessage').style.display = 'none';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            try {
                if (isLoginMode) {
                    const formData = new URLSearchParams();
                    formData.append('username', user);
                    formData.append('password', pass);

                    const response = await fetch('/api/auth/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });

                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('aegis_token', data.access_token);
                        window.location.href = 'index.html';
                    } else {
                        const err = await response.json();
                        errorDiv.textContent = err.detail || 'Login failed';
                        errorDiv.style.display = 'block';
                    }
                } else {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user, password: pass })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('aegis_token', data.access_token);
                        window.location.href = 'index.html';
                    } else {
                        const err = await response.json();
                        errorDiv.textContent = err.detail || 'Registration failed';
                        errorDiv.style.display = 'block';
                    }
                }
            } catch (err) {
                errorDiv.textContent = 'Network error occurred';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
